name: Desktop builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            architecture: x64
          - runner: macos-15-intel
            platform: mac
            architecture: x64
          - runner: macos-15
            platform: mac
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install frontend dependencies
        run: npm ci --prefix one-data/frontend
      - name: Install desktop dependencies
        run: npm ci --prefix one-data/desktop
      - name: Build desktop package
        run: npm --prefix one-data/desktop run dist:${{ matrix.platform }}
      - name: Save installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: one-data-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            one-data/desktop/release/*.exe
            one-data/desktop/release/*.dmg
            one-data/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
