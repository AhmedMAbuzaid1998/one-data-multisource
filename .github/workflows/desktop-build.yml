name: Confluence test desktop builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            architecture: x64
          - runner: macos-15-intel
            platform: mac
            architecture: x64
          - runner: macos-15
            platform: mac
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install frontend dependencies
        run: npm ci --prefix one-data/frontend
      - name: Install desktop dependencies
        run: npm ci --prefix one-data/desktop
      - name: Test Confluence parsing and cache behavior
        run: npm --prefix one-data/desktop test
      - name: Build desktop package
        run: npm --prefix one-data/desktop run dist:${{ matrix.platform }}
      - name: Zip complete Windows app
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $release = 'one-data/desktop/release-confluence'
          $folder = Join-Path $release 'One Data Confluence Test'
          Copy-Item -LiteralPath (Join-Path $release 'win-unpacked') -Destination $folder -Recurse
          Copy-Item -LiteralPath 'one-data/desktop/CONFLUENCE-TEST-INSTRUCTIONS.txt' -Destination (Join-Path $release 'START HERE.txt')
          Compress-Archive -Path $folder,(Join-Path $release 'START HERE.txt') -DestinationPath (Join-Path $release 'One Data Confluence Test Windows.zip')
      - name: Save installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: one-data-confluence-test-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            one-data/desktop/release-confluence/*.exe
            one-data/desktop/release-confluence/*.dmg
            one-data/desktop/release-confluence/*.zip
            one-data/desktop/CONFLUENCE-TEST-INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 14
